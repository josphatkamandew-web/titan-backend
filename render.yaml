services:
  - type: web
    name: titan-vsa-x-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TWELVE_DATA_API_KEY
        sync: false        # set manually in the Render dashboard — never commit real keys
      - key: ALLOWED_ORIGINS
        value: "https://REPLACE-WITH-YOUR-NETLIFY-SITE.netlify.app"
      - key: BRIEFING_SECRET
        sync: false        # set manually — must match the BRIEFING_SECRET GitHub Actions repo secret
      - key: DATABASE_URL
        fromDatabase:
          name: titan-vsa-x-db
          property: connectionString

databases:
  - name: titan-vsa-x-db
    plan: free
